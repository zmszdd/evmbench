[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.20"
evm_version = "paris"
optimizer = false
remappings = ["@openzeppelin/contracts/=src/@openzeppelin/contracts/", "@chainlink/contracts/=src/@chainlink/contracts/", "@uniswap/v3-core/=src/@uniswap/v3-core/", "@uniswap/v3-periphery/=src/@uniswap/v3-periphery/", "contracts/=src/contracts/", "hardhat/=src/hardhat/"]
